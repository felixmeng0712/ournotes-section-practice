name: OurNotesPractice
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: ""   # your Apple team ID (Xcode › Settings › Accounts); a free Apple ID works
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  OurNotesPractice:
    type: application
    platform: iOS
    sources:
      - OurNotes
      # the same web app the Mac server serves; bundled as-is
      - path: ../web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ournotes.practice
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: OurNotes/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "1"
